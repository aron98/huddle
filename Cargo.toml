[workspace]
resolver = "3"
members = ["crates/protocol", "crates/sfu", "crates/server", "crates/web"]
# The Tauri desktop shell (issue #18, ADR 014) is its own workspace: it needs
# GUI/webkit2gtk system deps that the 4-gate suite must never require. Keep
# this exclusion tightly delimited — sibling branches edit `members` above.
exclude = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aron98/huddle"

[workspace.dependencies]
# workspace crates
huddle-protocol = { path = "crates/protocol", version = "0.1.0" }
huddle-sfu = { path = "crates/sfu", version = "0.1.0" }
huddle-web = { path = "crates/web", version = "0.1.0" }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tracing = "0.1"
futures = "0.3"

# server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
str0m = "=0.24.1"
figment = { version = "0.10", features = ["toml", "env"] }
rust-embed = "8"
anyhow = "1"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "rustls-tls",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
] }

# web (wasm)
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "BinaryType",
    "Clipboard",
    "Crypto",
    "CryptoKey",
    "CryptoKeyPair",
    "DisplayMediaStreamConstraints",
    "EventTarget",
    "GainNode",
    "Headers",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Location",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackSettings",
    "MessageEvent",
    "Navigator",
    "Request",
    "RequestInit",
    "Response",
    "RtcConfiguration",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceTransportPolicy",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcRtpEncodingParameters",
    "RtcRtpParameters",
    "RtcRtpSender",
    "RtcRtpTransceiver",
    "RtcRtpTransceiverDirection",
    "RtcRtpTransceiverInit",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcTrackEvent",
    "Storage",
    "SubtleCrypto",
    "WebSocket",
    "Window",
] }
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = true
