[workspace]
resolver = "3"
members = ["crates/protocol", "crates/sfu", "crates/server", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aron98/huddle"

[workspace.dependencies]
# workspace crates
huddle-protocol = { path = "crates/protocol", version = "0.1.0" }
huddle-sfu = { path = "crates/sfu", version = "0.1.0" }
huddle-web = { path = "crates/web", version = "0.1.0" }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tracing = "0.1"
futures = "0.3"

# server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
str0m = "=0.24.1"
figment = { version = "0.10", features = ["toml", "env"] }
rust-embed = "8"
anyhow = "1"

# web (wasm)
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AnalyserNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "BinaryType",
    "GainNode",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "Location",
    "MediaDeviceKind",
    "MediaDeviceInfo",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MessageEvent",
    "Navigator",
    "RtcConfiguration",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcRtpSender",
    "RtcTrackEvent",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "WebSocket",
    "Window",
] }
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = true
