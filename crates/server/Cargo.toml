[package]
name = "huddle-server"
description = "The huddle server binary: HTTP, signaling, and media"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "huddle"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
figment.workspace = true
futures.workspace = true
huddle-protocol.workspace = true
huddle-sfu.workspace = true
hmac.workspace = true
lettre.workspace = true
rand = "0.10"
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
sqlx.workspace = true
str0m.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls-acme = { version = "0.15", features = ["axum", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.13"
str0m.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
