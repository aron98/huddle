<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>huddle</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: rgba(128, 128, 128); max-width: 32rem; }
    code { background: rgba(128, 128, 128, 0.15); padding: 0.15rem 0.4rem; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>huddle</h1>
    <p>The web UI bundle is not built into this binary yet.</p>
    <p>
      For development, build the client with
      <code>trunk watch</code> in <code>crates/web</code> and set
      <code>HUDDLE_WEB_DIR=../web/dist</code> when starting the server.
    </p>
  </main>
</body>
</html>
