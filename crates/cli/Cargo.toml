[package]
name = "huddle-cli"
description = "The huddle CLI and MCP server (issue #9 agent access)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "huddle-cli"
path = "src/main.rs"

[dependencies]
huddle-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
# The CLI is deliberately fully synchronous: `reqwest::blocking` runs
# its own reactor internally, so there is no tokio dependency and no
# async plumbing anywhere in this crate.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "blocking",
] }
clap = { version = "4", features = ["derive"] }
