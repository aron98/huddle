<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to a Huddle server</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      width: min(28rem, 90vw);
      padding: 2.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
    }
    .logo {
      width: 3rem;
      height: 3rem;
      border-radius: 0.6rem;
      background: #0d9488;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.6rem;
      color: #fff;
      margin: 0 auto 1rem;
    }
    h1 { font-size: 1.25rem; text-align: center; margin: 0 0 0.25rem; }
    p.hint { text-align: center; color: #94a3b8; margin: 0 0 1.5rem; font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font: inherit;
      background: #0f172a;
      color: inherit;
      border: 1px solid #334155;
      border-radius: 0.5rem;
    }
    input:focus { outline: 2px solid #0d9488; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #0d9488;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    button:hover { background: #0f766e; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error {
      display: none;
      margin-top: 1rem;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      background: #7f1d1d33;
      border: 1px solid #b91c1c;
      border-radius: 0.5rem;
      color: #fecaca;
      overflow-wrap: anywhere;
    }
    .error[data-visible] { display: block; }
    .example { color: #64748b; font-size: 0.8rem; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">h</div>
    <h1>Huddle Desktop</h1>
    <p class="hint">Enter the address of the Huddle server you want to use.</p>
    <form id="form">
      <label for="server">Server address</label>
      <input id="server" type="text" placeholder="meet.example.com" autocomplete="off"
             spellcheck="false" autocapitalize="off" autofocus>
      <div class="example">e.g. https://meet.example.com &mdash; or localhost:3000 for a local server</div>
      <button id="connect" type="submit">Connect</button>
      <div id="error" class="error" role="alert"></div>
    </form>
  </div>
  <script src="connect.js"></script>
</body>
</html>
