# electron-builder configuration for the Huddle desktop shell.
# Built by .github/workflows/release-desktop.yml on v* tags, one job
# per OS, artifacts attached to the GitHub release. macOS builds are
# Developer ID-signed + notarized (issue #103 — the signing secrets live
# as environment secrets of the `macos-signing` GitHub environment, see
# the workflow and electron/README.md). No Windows certificate exists:
# Windows/Linux builds are unsigned, and the release notes disclose that.

appId: io.github.aron98.huddle
productName: Huddle
copyright: Apache-2.0

# Updater feed generation (issue #109): electron-builder only writes the
# electron-updater channel files (latest.yml / latest-linux.yml /
# latest-mac.yml) and the AppImage blockmap when a publish provider is
# configured — with none, the v1.1.5 release shipped without them and
# softprops/action-gh-release silently skipped the unmatched globs.
# Declaring the GitHub provider makes electron-builder WRITE those files
# into dist/; CI still passes --publish never (release-desktop.yml does
# the uploading via the release action), so electron-builder itself
# never publishes anything.
publish:
  provider: github
  owner: aron98
  repo: huddle

directories:
  output: dist
  buildResources: build

# Everything the runtime needs lives in src/ + build/ icons. electron-updater
# is the only production npm dependency (issue #98) and electron-builder
# bundles production node_modules automatically; the client itself is still
# loaded from the server.
files:
  - src/**/*
  - build/icon.png
  - build/trayTemplate.png

asar: true
icon: build/icon.png
artifactName: huddle-${version}-${os}-${arch}.${ext}

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.video-conferencing
  # Developer ID signing + notarization (issue #103). `identity` is
  # intentionally OMITTED: electron-builder auto-detects the sole
  # "Developer ID Application" certificate in the keychain search list
  # (release-desktop.yml imports it into a dedicated temporary keychain).
  # An explicit value is a landmine — findIdentity rejects anything that
  # starts with "Developer ID Application:" (the full CN as printed by
  # `security find-identity`), `null` would skip signing, and "-" ad-hoc
  # sign (the old issue #86 workaround, which cannot be notarized).
  hardenedRuntime: true
  # notarize: true submits the signed app to Apple via notarytool and
  # staples the ticket automatically (@electron/notarize). Credentials
  # come from env in the release workflow: APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD (secrets) and APPLE_TEAM_ID (derived from
  # the imported certificate). Caveat: electron-builder 26.15.3 SKIPS
  # notarization with only a warning when credentials are missing — the
  # spctl/stapler checks in release-desktop.yml are what actually fail
  # the build if notarization did not happen.
  notarize: true

linux:
  target:
    - AppImage
    - deb
  category: Network
  synopsis: Huddle video meetings
  description: Desktop shell for Huddle — loads the web client served by a self-hosted Huddle server.
