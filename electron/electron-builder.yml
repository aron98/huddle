# electron-builder configuration for the Huddle desktop shell.
# Built by .github/workflows/release-desktop.yml on v* tags, one matrix
# job per OS, artifacts attached to the GitHub release. No Apple/Windows
# certificates in this repo: macOS builds are ad-hoc signed (see
# mac.identity below, issue #86), Windows/Linux builds are unsigned, and
# the release notes disclose that.

appId: io.github.aron98.huddle
productName: Huddle
copyright: Apache-2.0

directories:
  output: dist
  buildResources: build

# Everything the runtime needs lives in src/ + build/ icons; there are no
# production npm dependencies (the client is loaded from the server).
files:
  - src/**/*
  - build/icon.png
  - build/trayTemplate.png

asar: true
icon: build/icon.png
artifactName: huddle-${version}-${os}-${arch}.${ext}

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.video-conferencing
  # Ad-hoc signing (issue #86): arm64 macOS hard-blocks *unsigned* apps —
  # Gatekeeper reports them as "broken and can't be opened" — but runs
  # ad-hoc signed ones. In electron-builder 26.15.3 identity "-" forces an
  # ad-hoc signature (identity: null would SKIP signing entirely), and the
  # default entitlements template it pairs with includes
  # com.apple.security.cs.disable-library-validation, so the app launches.
  # No certificate is needed on the build machine (CI asserts the
  # signature — see release-desktop.yml). Ad-hoc is NOT notarized: first
  # launch still shows a Gatekeeper warning (right-click → Open, or
  # `xattr -rd com.apple.quarantine /Applications/Huddle.app`). A proper
  # Developer ID signature + notarization needs the paid Apple Developer
  # Program — recorded as a follow-up, out of scope here.
  identity: "-"

linux:
  target:
    - AppImage
    - deb
  category: Network
  synopsis: Huddle video meetings
  description: Desktop shell for Huddle — loads the web client served by a self-hosted Huddle server.
