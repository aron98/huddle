name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt, clippy, tests, wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The toolchain (and its rustfmt/clippy/wasm32 components) comes from
      # rust-toolchain.toml; this provisions it for the job.
      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (native)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test

      - name: check + clippy (wasm32)
        run: |
          cargo check -p huddle-web --target wasm32-unknown-unknown
          cargo clippy -p huddle-web --target wasm32-unknown-unknown -- -D warnings

      - name: install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint
        run: helm lint deploy/helm/huddle

  # One e2e job: build once, then run every test/e2e/e2e-*.mjs suite
  # sequentially through test/e2e/run-all.mjs. The runner discovers
  # suites by filename, so a new e2e test is just a new script — no
  # workflow edit. Failures list every broken suite (the runner keeps
  # going after the first failure), and each suite runs under its own
  # process-group kill timer so a hung script cannot wedge the job.
  # Deliberately separate from `checks`: fmt/clippy/tests are fast and
  # orthogonal to browser flake, so a bisect keeps cheap signal.
  e2e:
    name: browser e2e suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: install trunk
        run: |
          curl -fsSL \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin
          trunk --version

      - name: build web client
        run: trunk build
        working-directory: crates/web

      - name: build server
        run: cargo build -q -p huddle-server

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: test/e2e

      # The system google-chrome wedges under the new headless mode when a
      # second target exists: CDP Runtime.callFunctionOn responses are lost
      # while the renderer main thread sits idle in a timed wait. The app
      # itself is fine (single-page runs and headless-shell runs both pass),
      # so pin the official headless Chrome binary used for local runs.
      - name: install chrome-headless-shell
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@155.0.8059.39 --path "$HOME/chrome"
          echo "CHROME_BIN=$(find "$HOME/chrome" -type f -name chrome-headless-shell)" >> "$GITHUB_ENV"

      # coturn provides the TURN relay the e2e-turn suite asserts
      # against; the suite spawns its own turnserver instance (config
      # file, port 3479) so a distribution's default service can never
      # conflict.
      - name: install coturn
        run: sudo apt-get update && sudo apt-get install -y coturn

      - name: e2e suites
        run: node run-all.mjs
        working-directory: test/e2e

  # Desktop shell gate: pure node — `node --check` over every shell file plus
  # the node:test unit tests over the pure-logic modules. No npm install
  # needed (the shell has no runtime dependencies), so this stays a
  # seconds-cheap job next to the Rust/e2e gates.
  desktop:
    name: electron shell check + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: syntax check
        run: npm run check
        working-directory: electron

      - name: unit tests
        run: npm test
        working-directory: electron
