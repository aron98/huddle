# Desktop bundling: on a pushed v* tag, build unsigned Electron installers
# (Windows exe, macOS dmg, Linux AppImage + deb) and attach them to the
# GitHub release. Mirrors release.yml (the server tarball) — one matrix job
# per OS because electron-builder produces platform-native artifacts.
#
# Builds are UNSIGNED (mac signing is explicitly disabled); the release
# notes disclose the SmartScreen/Gatekeeper warnings that come with that.

name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: install dev dependencies
        run: npm ci
        working-directory: electron

      # Prove the shipped tree before spending minutes on bundling.
      - name: syntax check + unit tests
        run: |
          npm run check
          npm test
        working-directory: electron

      - name: build installers
        run: npx electron-builder --publish never
        working-directory: electron
        env:
          # No Apple Developer certificate in this repo — never probe for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: artifact filename smoke check
        run: ls -la dist
        working-directory: electron
        if: runner.os != 'Windows'

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/huddle-*.exe
            electron/dist/huddle-*.dmg
            electron/dist/huddle-*.AppImage
            electron/dist/huddle-*.deb
