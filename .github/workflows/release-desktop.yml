# Desktop bundling: on a pushed v* tag, build the Electron installers
# (Windows exe, macOS dmg, Linux AppImage + deb) and attach them to the
# GitHub release. Mirrors release.yml (the server tarball) — one matrix job
# per OS because electron-builder produces platform-native artifacts.
#
# macOS builds are AD-HOC signed (mac.identity: "-" in
# electron/electron-builder.yml, issue #86) so Apple Silicon stops
# reporting the app as "broken and can't be opened"; no certificate is
# installed on the runner and the workflow asserts the ad-hoc signature
# after bundling. Windows/Linux builds stay unsigned — SmartScreen/
# Gatekeeper first-launch warnings are disclosed in the release notes.
#
# The release also carries electron-updater's metadata (latest.yml /
# latest-linux.yml + blockmaps) so the packaged desktop app can
# self-update against GitHub Releases (issue #98; macOS is notify-only,
# see electron/README.md — Auto-update).

name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: install dev dependencies
        run: npm ci
        working-directory: electron

      # Prove the shipped tree before spending minutes on bundling.
      - name: syntax check + unit tests
        run: |
          npm run check
          npm test
        working-directory: electron

      - name: build installers
        run: npx electron-builder --publish never
        working-directory: electron

      - name: artifact filename smoke check
        run: ls -la dist
        working-directory: electron
        if: runner.os != 'Windows'

      # Issue #86: arm64 macOS hard-blocks *unsigned* apps ("broken and
      # can't be opened"). electron-builder leaves the unpacked bundle at
      # dist/mac*/Huddle.app after the dmg build — assert it carries an
      # ad-hoc signature (mac.identity: "-").
      - name: verify ad-hoc signature
        if: runner.os == 'macOS'
        working-directory: electron
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 3 -name 'Huddle.app' -type d | head -n 1)
          test -n "$app" || { echo "no unpacked Huddle.app found under dist"; exit 1; }
          log="$RUNNER_TEMP/codesign-dv.log"
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$log"
          grep -q 'adhoc' "$log" || {
            echo "::error::Huddle.app has no ad-hoc signature — arm64 Gatekeeper would report it as broken (issue #86)"
            exit 1
          }

      - uses: softprops/action-gh-release@v2
        with:
          # latest.yml / latest-linux.yml / *.blockmap feed the desktop
          # app's electron-updater (issue #98): it reads the yml to find
          # the current version + artifact URL and uses the blockmap for
          # differential downloads. Globs that match nothing in a given
          # matrix job (e.g. latest.yml on the macOS runner) are skipped,
          # same as the per-OS installer globs below.
          files: |
            electron/dist/huddle-*.exe
            electron/dist/huddle-*.exe.blockmap
            electron/dist/huddle-*.dmg
            electron/dist/huddle-*.AppImage
            electron/dist/huddle-*.AppImage.blockmap
            electron/dist/huddle-*.deb
            electron/dist/latest.yml
            electron/dist/latest-linux.yml
