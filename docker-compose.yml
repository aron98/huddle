# Dev stack: hot-reloading web client + API server + TURN companion.
#
#     docker compose up
#
# - `web` watches the web crate and rebuilds crates/web/dist on every change;
# - `server` serves that directory via HUDDLE_WEB_DIR, so UI edits show up on
#   the next browser refresh (server code changes need a container restart);
# - `coturn` is the TURN companion from the architecture doc (dev credentials).
#
# Both `server` and `coturn` use host networking (Linux only): WebRTC media
# is UDP from arbitrary client ports, which double NAT (docker bridge +
# port mapping) makes flaky. With host networking the default advertised
# address (127.0.0.1) works for same-machine browser testing; set
# HUDDLE_PUBLIC_IP below to your LAN ip for calls from other devices.

services:
  web:
    image: rust:1.96-slim-bookworm
    working_dir: /workspace/crates/web
    # The rust slim images don't ship curl, and trunk is installed from the
    # same pinned release binary used by CI and the production Dockerfile.
    command: >
      sh -c "apt-get update -qq && apt-get install -qq -y --no-install-recommends curl
      && rustup target add wasm32-unknown-unknown
      && curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
      && trunk watch"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry

  server:
    image: rust:1.96-slim-bookworm
    working_dir: /workspace
    # Host networking: the media UDP socket (default port 40000) must be
    # directly reachable from the browser for calls to work.
    network_mode: host
    command: cargo run -p huddle-server
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
    environment:
      HUDDLE_BIND: 0.0.0.0:3000
      HUDDLE_WEB_DIR: /workspace/crates/web/dist
      HUDDLE_DATA_DIR: /workspace/data
      # Point the advertised ICE servers at the dev TURN companion. Nested
      # env vars use figment's `__` indexing: ICE_SERVERS[0] with urls[0..2].
      HUDDLE_ICE_SERVERS__0__URLS__0: stun:127.0.0.1:3478
      HUDDLE_ICE_SERVERS__0__URLS__1: turn:127.0.0.1:3478
      HUDDLE_ICE_SERVERS__0__USERNAME: huddle
      HUDDLE_ICE_SERVERS__0__CREDENTIAL: devpassword
    depends_on:
      - web

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  cargo-registry:
