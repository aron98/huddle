# Dev stack: hot-reloading web client + API server + TURN companion.
#
#     docker compose up
#
# - `web` watches the web crate and rebuilds crates/web/dist on every change;
# - `server` serves that directory via HUDDLE_WEB_DIR, so UI edits show up on
#   the next browser refresh (server code changes need a container restart);
# - `coturn` is the TURN companion from the architecture doc (dev credentials;
#   the production template with TURN over TLS is deploy/turn/turnserver.conf);
# - `mux` (profile `recording`) post-processes meeting recordings; see below.
#
# Both `server` and `coturn` use host networking (Linux only): WebRTC media
# is UDP from arbitrary client ports, which double NAT (docker bridge +
# port mapping) makes flaky. With host networking the server auto-detects
# and advertises the machine's LAN ip, which works for same-machine and
# same-LAN browser testing alike; set HUDDLE_PUBLIC_IP to override.

services:
  web:
    image: rust:1.96-slim-bookworm
    working_dir: /workspace/crates/web
    # The rust slim images don't ship curl, and trunk is installed from the
    # same pinned release binary used by CI and the production Dockerfile.
    command: >
      sh -c "apt-get update -qq && apt-get install -qq -y --no-install-recommends curl
      && rustup target add wasm32-unknown-unknown
      && curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
      && trunk watch"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry

  server:
    image: rust:1.96-slim-bookworm
    working_dir: /workspace
    # Host networking: the media UDP socket (default port 40000) must be
    # directly reachable from the browser for calls to work.
    network_mode: host
    command: cargo run -p huddle-server
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
    environment:
      HUDDLE_BIND: 0.0.0.0:3000
      HUDDLE_WEB_DIR: /workspace/crates/web/dist
      HUDDLE_DATA_DIR: /workspace/data
      # Point the advertised ICE servers at the dev TURN companion.
      # figment parses array-of-dicts *values* (TOML-ish `key=value`
      # pairs inside `[...]`, not JSON colons) — `__0__`-style key
      # nesting produces dicts that never reach a Vec field.
      HUDDLE_ICE_SERVERS: '[{urls=["stun:127.0.0.1:3478","turn:127.0.0.1:3478"],username="huddle",credential="devpassword"}]'
    depends_on:
      - web

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  # Recording sidecar (issue #15). The server records each take as
  # length-framed per-track RTP under the shared data volume,
  #   {data_dir}/recordings/{meeting_id}/{recording_id}/
  # and this service muxes a finished take into a single playable .mp4:
  # video tiles (xstack) plus mixed audio (amix). It shares the server's
  # data volume and needs no networking — the RTP replay is loopback
  # inside the container. Run it on demand, once a recording has stopped:
  #   MEETING_ID=<uuid> RECORDING_ID=<uuid> \
  #     docker compose --profile recording run --rm mux
  # The recording UUIDs come from the REST status endpoint,
  #   GET /api/meetings/{code}/recording
  # HUDDLE_MUX_SPEED (default 8) replays the capture faster than real
  # time; lower it if a long recording drops datagrams during demux.
  mux:
    build: deploy/recording
    profiles: ["recording"]
    volumes:
      - ./data:/workspace/data
    environment:
      MEETING_ID: ${MEETING_ID:?set MEETING_ID to the recorded meeting's uuid}
      RECORDING_ID: ${RECORDING_ID:?set RECORDING_ID to the take's uuid}
      DATA_DIR: /workspace/data

volumes:
  cargo-registry:
