# coturn production template with TURN over TLS (issue #31).
#
# This is the TLS-enabled companion to the development defaults in
# deploy/coturn/turnserver.conf (which the e2e suite also leans on — do not
# point tests at this file). Copy this file to e.g. /etc/turnserver.conf,
# fill in the paths and secret, and run:
#   turnserver -c /etc/turnserver.conf
#
# TURN over TLS is TCP-only in coturn: the `turns:` URL implies
# ?transport=tcp. Keep plain UDP on 3478 too — most browsers get their
# relay over UDP and only fall back to the TLS listener when TCP
# tunneling is forced by the network.

# --- listeners ---
listening-port=3478
# TLS listener for clients behind TCP-only / TLS-inspecting middleboxes:
tls-listening-port=5349
# Requires a certificate covering the TURN hostname. Let's Encrypt works
# (renew, then `systemctl reload coturn` — coturn re-reads files on reload):
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
# DTLS on the UDP listener shares the same certificate:
# no-dtls        # (commented out: DTLS is on by default and uses the same cert)

# --- authentication (recommended over fixed user:password pairs) ---
use-auth-secret
# Generate one: `openssl rand -hex 32`. Huddle does not speak auth-secret
# natively, so if you use it, put the same secret in an ICE-credentials
# helper in front of huddle — or switch to lt-cred-mech + user= lines and
# mirror the pair in huddle's [[ice_servers]] exactly like the dev setup.
static-auth-secret=replace-me-with-a-long-random-secret
# If you prefer the long-term credential mechanism instead (what the
# huddle [[ice_servers]] example in the README uses), comment the two
# lines above and use:
# lt-cred-mech
# realm=turn.example.com
# user=huddle:<a-long-random-password>

# --- network ---
realm=turn.example.com
# listening-ip= and relay-ip= if the box has several interfaces
min-port=49160
max-port=49200
no-cli
# In production do NOT copy allow-loopback-peers from the e2e configs.

# --- advertising TURN over TLS to huddle clients ---
# In huddle's config (huddle.toml), advertise both listeners:
#   [[ice_servers]]
#   urls = [
#     "turn:turn.example.com:3478?transport=udp",
#     "turn:turn.example.com:3478?transport=tcp",
#     "turns:turn.example.com:5349?transport=tcp",
#   ]
#   # with lt-cred-mech: username = "huddle", credential = "<password>"
