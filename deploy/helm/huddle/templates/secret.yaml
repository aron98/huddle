{{/* Chart-managed Secret for credentials that must not land in the
     ConfigMap (TURN password inside HUDDLE_ICE_SERVERS, mailer API
     keys, ...). Opt-in: nothing is rendered when extraSecret is empty.
     The name is <fullname>-extra-secret — load it with extraEnvFrom:
     - type: Secret
       name: <fullname>-extra-secret */}}
{{- with .Values.extraSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huddle.fullname" $ }}-extra-secret
  labels:
    app: {{ include "huddle.fullname" $ }}
type: Opaque
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
