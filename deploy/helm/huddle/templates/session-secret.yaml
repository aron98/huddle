{{/* Session-cookie HMAC key (HUDDLE_SESSION_SECRET). Setting
      server.sessionSecret makes the chart create this Secret named
      <fullname>-secret — exactly the name the Deployment's secretKeyRef
      already defaults to. With existingSecret set instead, the chart
      consumes that out-of-band Secret and renders nothing here. */}}
{{- if and .Values.server.sessionSecret (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huddle.fullname" . }}-secret
  labels:
    app: {{ include "huddle.fullname" . }}
type: Opaque
stringData:
  HUDDLE_SESSION_SECRET: {{ .Values.server.sessionSecret | quote }}
{{- end }}
