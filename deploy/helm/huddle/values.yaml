# Default values for huddle.
#
# WebRTC realities drive the shape of this chart:
#  * The SFU's media socket must be reachable from browsers on the
#    advertised IP:port — no k8s Service can proxy that correctly for
#    ICE (the advertised candidate is the pod host's, not the LB's).
#    Default is therefore hostNetwork + hostPort for the media port;
#    set `hostNetwork: false` only if you front media some other way.
#  * One replica per node: the SFU keeps meeting state in memory, and
#    meetings are not sharded across pods. Scale out = more replicas,
#    each a separate island (a load-balanced join URL per island).

image:
  repository: ghcr.io/aron98/huddle
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

hostNetwork: true

service:
  type: ClusterIP
  port: 3000

server:
  # Address browsers use to reach the web app (join links, magic links,
  # ICS URLs). Must be set to a real externally reachable URL in
  # production, e.g. https://meet.example.com
  baseUrl: http://localhost:3000
  # The IP advertised in ICE candidates. With hostNetwork the pod can
  # auto-detect the node IP; set it explicitly to skip detection.
  publicIp: ""
  mediaPort: 40000
  # ICE servers advertised to clients in addition to the SFU itself —
  # point this at your coturn. For a coturn with TURN over TLS enabled,
  # see the deploy/turn/turnserver.conf template (turns:...:5349 URLs).
  # WARNING: this value lands in the chart's plain ConfigMap — for the
  # TURN credential use extraSecret + extraEnvFrom instead (below).
  iceServers: ""
  # Setting this makes the chart create a Secret named <fullname>-secret
  # with this value under HUDDLE_SESSION_SECRET. Prefer existingSecret
  # in production: values land in plain files / --set CLI history.
  sessionSecret: "" # random per boot when unset (with existingSecret)

# Name of an existing Secret with a HUDDLE_SESSION_SECRET key — takes
# precedence over server.sessionSecret and keeps the secret out of values.
existingSecret: ""

# Extra environment variables for the huddle container, appended after
# the chart's own env. Literal values and valueFrom refs are both
# supported; env entries always win over envFrom sources (Kubernetes
# precedence) and thus can override the chart's ConfigMap.
# extraEnv:
#   - name: HUDDLE_MAIL_PROVIDER
#     value: resend
#   - name: HUDDLE_MAIL_RESEND_API_KEY
#     valueFrom:
#       secretKeyRef:
#         name: huddle-mailer
#         key: HUDDLE_MAIL_RESEND_API_KEY
extraEnv: []

# Extra envFrom sources, appended after the chart's own ConfigMap so a
# key defined here overrides the ConfigMap's on collisions. Each entry
# is {type: Secret | ConfigMap, name, prefix (optional)}.
# extraEnvFrom:
#   - type: Secret
#     name: huddle-ice
extraEnvFrom: []

# Optional chart-managed Secret, for deployments that don't want to
# hand-roll a Secret manifest. When non-empty the chart creates a
# Secret named <fullname>-extra-secret with these stringData keys —
# load it with extraEnvFrom (see above). Keep credentials here (TURN
# password in HUDDLE_ICE_SERVERS, mailer API keys), NOT in the
# server.* values that land in the plain ConfigMap.
# extraSecret:
#   HUDDLE_ICE_SERVERS: '[{urls=["turn:turn.example.com:3478?transport=udp"],username="huddle",credential="REPLACE_WITH_TURN_PASSWORD"}]'
extraSecret: {}

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
