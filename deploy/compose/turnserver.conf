# Production coturn configuration for the deploy/compose stack.
# Companion to docs/deploy/docker-compose.md — see deploy/turn/turnserver.conf
# in the repo root for the plain (non-Docker) template with full commentary.
#
# Huddle mints TURN REST API credentials (issue #59): set the SAME
# shared secret as HUDDLE_TURN_SHARED_SECRET in docker-compose.yml/.env,
# and coturn validates the time-limited pairs huddle hands out per join.
# No static TURN password exists anywhere. (Static lt-cred-mech + user=
# still works if you prefer it — see the commented fallback below.)
#
# NOTE: coturn does NOT support inline `#` comments (issue #82) — a line
# like `listening-port=3478  # UDP` parses the whole tail as the value and
# coturn exits with "Invalid port value". Keep comments on their own lines.

# TURN listener: UDP + TCP on one port.
listening-port=3478

# Relay range — must match the host firewall rules.
min-port=49160
max-port=49200

# TURN REST API: the secret must match HUDDLE_TURN_SHARED_SECRET in .env
# EXACTLY. Generate: `openssl rand -hex 32`, then run the sed command from
# docs/deploy/docker-compose.md to write it in here (this file cannot read
# environment variables).
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SHARED_SECRET

# Set to your TURN domain.
realm=turn.example.com

# Static fallback (the dev shape): comment the use-auth-secret /
# static-auth-secret / realm lines above, uncomment these, and mirror
# the pair in HUDDLE_ICE_SERVERS (docker-compose.yml):
# lt-cred-mech
# user=huddle:REPLACE_WITH_TURN_PASSWORD

# TURN over TLS is disabled out of the box: coturn refuses to start the
# 5349 TCP listener without a certificate (turns: implies tcp — UDP relay
# keeps using plain 3478). To enable it later, see "coturn TLS (optional)"
# in docs/deploy/docker-compose.md:
#   1. provision a PEM certificate for the TURN domain on the host
#      (certbot) and drop it under ./certs/,
#   2. uncomment the ./certs bind mount in docker-compose.yml,
#   3. uncomment the three lines below.
# The certificate also enables DTLS on the 3478/udp listener.
#tls-listening-port=5349
#cert=/etc/coturn/certs/turn.example.com/fullchain.pem
#pkey=/etc/coturn/certs/turn.example.com/privkey.pem

# Hardening
fingerprint
no-cli
no-multicast-peers
# NEVER enable allow-loopback-peers (opens a relay to localhost).
