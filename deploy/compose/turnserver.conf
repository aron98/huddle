# Production coturn configuration for the deploy/compose stack.
# Companion to docs/deploy/docker-compose.md — see deploy/turn/turnserver.conf
# in the repo root for the plain (non-Docker) template with full commentary.
#
# Huddle advertises TURN with STATIC username/credential pairs
# ([[ice_servers]] in huddle.toml / HUDDLE_ICE_SERVERS), so coturn MUST use
# lt-cred-mech + user= (below), NOT use-auth-secret: huddle has no REST-auth
# credential helper, so auth-secret credentials could never be generated.

listening-port=3478                 # UDP + TCP
tls-listening-port=5349             # TURN over TLS — TCP only (turns: implies tcp)

# Relay range — must match the host firewall rules.
min-port=49160
max-port=49200

# Static credentials: must mirror the HUDDLE_ICE_SERVERS username/credential
# in docker-compose.yml EXACTLY. Replace the placeholder with the value of
# TURN_PASSWORD from .env (one-liner in docs/deploy/docker-compose.md).
lt-cred-mech
realm=turn.example.com             # set to your TURN domain
user=huddle:REPLACE_WITH_TURN_PASSWORD

# TLS certificate for 5349/tcp and DTLS on the 3478/udp listener.
# Provision on the HOST (certbot), then uncomment the ./certs bind mount in
# docker-compose.yml. Comment these two lines out until the files exist.
#cert=/etc/coturn/certs/turn.example.com/fullchain.pem
#pkey=/etc/coturn/certs/turn.example.com/privkey.pem

# Hardening
fingerprint
no-cli
no-multicast-peers
# NEVER enable allow-loopback-peers (opens a relay to localhost).
