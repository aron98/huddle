# TURN companion for huddle (dev defaults).
#
# huddle clients receive these servers via the `ice_servers` config and the
# signaling Welcome message; the SFU's own host candidate covers same-network
# calls, TURN covers restrictive NATs.
#
# Production checklist:
# - set `realm` to your domain,
# - replace the static credential below (or use the `static-auth-secret`
#   mechanism and generate credentials per meeting),
# - enable TLS (cert + pkey) — WebRTC over TURN without TLS is rarely
#   reachable from locked-down networks.

listening-port=3478
fingerprint
lt-cred-mech
realm=huddle.dev
user=huddle:devpassword

# Relay port range; open these in the firewall.
min-port=49160
max-port=49200

# Dev defaults: no admin CLI, no TLS.
no-cli
no-tls
no-dtls
